services:
  # PostgreSQL 数据库
  antd-gin-postgres:
    image: postgres:15-alpine
    container_name: antd-gin-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: antd_gin_admin_scaffold
      POSTGRES_USER: antd-gin
      POSTGRES_PASSWORD: antd-gin123
    ports:
      - "15432:5432"
    volumes:
      - antd-gin-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U antd-gin -d antd_gin_admin_scaffold"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antd-gin-network

  # Redis 缓存
  antd-gin-redis:
    image: redis:7-alpine
    container_name: antd-gin-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - antd-gin-redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - antd-gin-network

  # 后端服务
  antd-gin-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: antd-gin-backend
    restart: unless-stopped
    ports:
      - "18080:8080"
    volumes:
      - ./backend/configs:/root/configs
    environment:
      - TZ=Asia/Shanghai
      - CONFIG_FILE=configs/config.docker.yaml
    depends_on:
      antd-gin-postgres:
        condition: service_healthy
      antd-gin-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/system/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - antd-gin-network

  # 前端服务
  antd-gin-frontend:
    build:
      context: ./frontend/admin-web
      dockerfile: Dockerfile
    container_name: antd-gin-frontend
    restart: unless-stopped
    ports:
      - "18000:80"
    depends_on:
      - antd-gin-backend
    networks:
      - antd-gin-network

  # 前端 CI / 本地校验：不随 up 启动（profile: ci）。在仓库根目录执行例如：
  #   docker compose --profile ci run --rm antd-gin-frontend-ci sh -lc "npm install --legacy-peer-deps && npm run lint"
  #   docker compose --profile ci run --rm antd-gin-frontend-ci sh -lc "npm install --legacy-peer-deps && npm run build"
  # 若本机已有与 Linux 兼容的 node_modules，可省略 install，直接 npm run lint。
  antd-gin-frontend-ci:
    profiles: ["ci"]
    image: node:20-bookworm-slim
    working_dir: /app
    volumes:
      - ./frontend/admin-web:/app
    environment:
      NPM_CONFIG_REGISTRY: https://registry.npmmirror.com
    networks:
      - antd-gin-network

networks:
  antd-gin-network:
    driver: bridge

volumes:
  antd-gin-pg-data:
    driver: local
  antd-gin-redis-data:
    driver: local

