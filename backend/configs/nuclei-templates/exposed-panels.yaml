id: exposed-panels
info:
  name: Exposed Admin Panels
  author: antd-gin-admin
  severity: high
  description: Probes common admin panel paths (local fixture).
http:
  - method: GET
    path:
      - "{{BaseURL}}/admin"
      - "{{BaseURL}}/administrator"
      - "{{BaseURL}}/login"
      - "{{BaseURL}}/wp-admin"
    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200
          - 401
          - 403
      - type: word
        part: body
        words:
          - "admin"
          - "login"
          - "password"
          - "sign in"
          - "dashboard"
        condition: or
        case-insensitive: true
