id: http-missing-security-headers
info:
  name: HTTP Missing Security Headers
  author: antd-gin-admin
  severity: info
  description: Detects missing common security headers (local fixture for private deploy).
http:
  - method: GET
    path:
      - "{{BaseURL}}"
    matchers-condition: or
    matchers:
      - type: dsl
        dsl:
          - "!contains(to_lower(header), 'content-security-policy')"
        name: content-security-policy
      - type: dsl
        dsl:
          - "!contains(to_lower(header), 'x-frame-options')"
        name: x-frame-options
