server:
  port: "8080"
  mode: "debug"
  read_timeout: 60
  write_timeout: 60

database:
  driver: "postgres"
  host: "antd-gin-postgres"
  port: 5432
  username: "antd-gin"
  password: "antd-gin123"
  database: "antd_gin_admin_scaffold"
  ssl_mode: "disable"
  timezone: "Asia/Shanghai"

redis:
  host: "antd-gin-redis"
  port: 6379
  password: ""
  db: 0

auth:
  use_mock: false

bootstrap:
  admin_username: "admin"
  admin_password: "Admin@123"
  admin_nickname: "超级管理员"

jwt:
  secret: "antd-gin-admin-scaffold-secret-key"
  expire_time: 7200
  issuer: "antd-gin-admin-scaffold"

log:
  level: "info"
  format: "json"

# 扫描报告对象存储（S3 兼容；Compose 默认 MinIO，见 ADR-0003）
# 运行时可被环境变量 S3_* 覆盖；当前服务装配仍可用内存假实现做本地联调。
s3:
  endpoint: "http://antd-gin-minio:9000"
  access_key: "minioadmin"
  secret_key: "minioadmin123"
  bucket: "scan-reports"
  use_path_style: true

scan:
  engine: "auto"
  nuclei_bin: "nuclei"
  nuclei_templates: "configs/nuclei-templates"

