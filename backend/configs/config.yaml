server:
  port: "8080"
  mode: "debug"
  read_timeout: 60
  write_timeout: 60

database:
  driver: "postgres"
  host: "localhost"
  port: 15432
  username: "antd-gin"
  password: "antd-gin123"
  database: "antd_gin_admin_scaffold"
  ssl_mode: "disable"
  timezone: "Asia/Shanghai"

redis:
  host: "localhost"
  port: 16379
  password: ""
  db: 0

auth:
  use_mock: false

bootstrap:
  admin_username: "admin"
  admin_password: "Admin@123"
  admin_nickname: "超级管理员"

jwt:
  secret: "antd-gin-admin-scaffold-secret-key"
  expire_time: 7200
  issuer: "antd-gin-admin-scaffold"

log:
  level: "info"
  format: "json"
  retention_days: 3
  file_path: "logs/app.log"
  max_size_mb: 100

# 扫描引擎：auto=本机有 nuclei 则用真引擎，否则假引擎
# 默认使用仓库内固化模板（私有化可控，见 ADR-0002）；也可改指向官方 nuclei-templates 目录
scan:
  engine: "auto"
  nuclei_bin: "nuclei"
  nuclei_templates: "configs/nuclei-templates"
